version: '3.8'

services:
  herotrack:
    build: .
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    
  # Optional: Add SSL with Let's Encrypt
  # Uncomment and configure if you want HTTPS
