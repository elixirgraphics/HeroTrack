<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button OAuth Test</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .warning { background: #fff3cd; color: #856404; border: 1px solid #ffeaa7; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        pre { background: #f8f9fa; padding: 15px; border-radius: 5px; overflow-x: auto; }
        #google-signin-button { margin: 20px 0; }
    </style>
</head>
<body>
    <h1>🔘 Button-Based OAuth Test</h1>
    
    <div class="info status">
        <strong>This test uses Google's button rendering instead of prompt()</strong><br>
        <strong>Client ID:</strong> <code>974614962211-0fj3h3d937f3n40ihtmt7deier9pnr6r.apps.googleusercontent.com</code>
    </div>

    <div id="status-container">
        <!-- Status messages will appear here -->
    </div>

    <div id="google-signin-button">
        <!-- Google sign-in button will be rendered here -->
    </div>

    <div id="result-container" style="margin-top: 20px;">
        <!-- Results will appear here -->
    </div>

    <h2>🖥️ Console Output</h2>
    <pre id="console-output">Starting button test...\n</pre>

    <script>
        const CLIENT_ID = '974614962211-0fj3h3d937f3n40ihtmt7deier9pnr6r.apps.googleusercontent.com';
        
        // Console logging
        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const output = document.getElementById('console-output');
            output.textContent += `[${timestamp}] ${message}\n`;
            output.scrollTop = output.scrollHeight;
            
            console.log(`[Button OAuth Test] ${message}`);
        }

        // Show status
        function showStatus(message, type = 'info') {
            const container = document.getElementById('status-container');
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.innerHTML = message;
            container.appendChild(div);
        }

        // Show result
        function showResult(success, data, error) {
            const container = document.getElementById('result-container');
            
            if (success) {
                container.innerHTML = `
                    <div class="success status">
                        <h3>✅ OAuth Success!</h3>
                        <p><strong>Name:</strong> ${data.name}</p>
                        <p><strong>Email:</strong> ${data.email}</p>
                        <p><strong>Avatar:</strong> <img src="${data.picture}" style="width: 40px; height: 40px; border-radius: 50%; vertical-align: middle; margin-left: 10px;"></p>
                        <p><strong>User ID:</strong> ${data.sub}</p>
                    </div>
                `;
                log(`SUCCESS: Authenticated as ${data.name} (${data.email})`);
                
                // Store in localStorage like the main app does
                const user = {
                    id: data.sub,
                    email: data.email,
                    name: data.name,
                    picture: data.picture
                };
                localStorage.setItem('herotrack_user', JSON.stringify(user));
                log('User data stored in localStorage');
            } else {
                container.innerHTML = `
                    <div class="error status">
                        <h3>❌ OAuth Failed</h3>
                        <p><strong>Error:</strong> ${error}</p>
                    </div>
                `;
                log(`ERROR: ${error}`, 'error');
            }
        }

        // Handle OAuth response
        function handleCredentialResponse(response) {
            try {
                log('Processing OAuth response...');
                log(`Credential received: ${response.credential.substring(0, 50)}...`);
                
                const payload = JSON.parse(atob(response.credential.split('.')[1]));
                log(`Decoded payload: ${JSON.stringify(payload, null, 2)}`);
                
                showResult(true, payload);
            } catch (error) {
                log(`Error parsing response: ${error.message}`, 'error');
                showResult(false, null, `Failed to parse OAuth response: ${error.message}`);
            }
        }

        // Initialize Google OAuth with button rendering
        function initializeOAuth() {
            log('Checking if Google OAuth script is loaded...');
            
            if (!window.google || !window.google.accounts) {
                log('Google OAuth script not loaded', 'error');
                showStatus('❌ Google OAuth script failed to load', 'error');
                return false;
            }

            log('Google OAuth script loaded successfully');
            showStatus('✅ Google OAuth script loaded', 'success');

            try {
                log('Initializing Google OAuth...');
                
                // Initialize the OAuth
                window.google.accounts.id.initialize({
                    client_id: CLIENT_ID,
                    callback: handleCredentialResponse,
                    auto_select: false,
                    cancel_on_tap_outside: true,
                    use_fedcm_for_prompt: false // Disable FedCM which can cause issues
                });

                log('OAuth initialized successfully');
                showStatus('✅ OAuth initialized successfully', 'success');
                
                // Render the sign-in button
                log('Rendering Google Sign-In button...');
                window.google.accounts.id.renderButton(
                    document.getElementById('google-signin-button'),
                    {
                        theme: 'outline',
                        size: 'large',
                        text: 'signin_with',
                        shape: 'rectangular',
                        logo_alignment: 'left'
                    }
                );
                
                log('Sign-in button rendered successfully');
                showStatus('✅ Google Sign-In button rendered', 'success');
                
                return true;
            } catch (error) {
                log(`OAuth initialization failed: ${error.message}`, 'error');
                showStatus(`❌ OAuth initialization failed: ${error.message}`, 'error');
                return false;
            }
        }

        // Initialize page
        function initializePage() {
            log(`Page loaded: ${window.location.href}`);
            log(`Client ID: ${CLIENT_ID}`);
            
            // Wait for Google script to load
            let attempts = 0;
            const maxAttempts = 10;
            
            const checkScript = () => {
                attempts++;
                log(`Checking for Google script (attempt ${attempts}/${maxAttempts})...`);
                
                if (window.google && window.google.accounts) {
                    initializeOAuth();
                } else if (attempts < maxAttempts) {
                    setTimeout(checkScript, 1000);
                } else {
                    log('Google script failed to load after 10 attempts', 'error');
                    showStatus('❌ Google OAuth script failed to load. Check your internet connection.', 'error');
                }
            };
            
            checkScript();
        }

        // Start when page loads
        document.addEventListener('DOMContentLoaded', initializePage);
    </script>
</body>
</html>
